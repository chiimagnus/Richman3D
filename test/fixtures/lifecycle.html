<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>Lifecycle fixture</title></head>
  <body>
    <div style="position:fixed;z-index:20;top:90px;max-width:320px">
      <button id="start">Start fixture</button>
      <select id="seats" aria-label="Fixture seats"><option>2</option><option>3</option><option>4</option></select>
      <select id="human" aria-label="Fixture human"><option value="0">First</option><option value="1">Second</option></select>
      <button id="dispose">Dispose fixture</button>
      <button id="unmount">Unmount view</button>
      <button id="bind">Bind view</button>
      <button id="hold-save">Hold next save</button>
      <button id="release-save">Release save</button>
      <output id="stats" style="display:block;max-height:90px;overflow:auto;overflow-wrap:anywhere;pointer-events:none"></output>
    </div>
    <div id="app"></div>
    <script type="module" src="./lifecycle.tsx"></script>
  </body>
</html>
